             ' at ' + flopsTxt(r[1]) + ' FLOPs') + '"/>');
    });
    s.push('<circle class="hit" data-p="final" cx="' + ax.toFixed(1) + '" cy="' + ay.toFixed(1) + '" r="' + (hr + 2) +
           '" tabindex="0" role="button" aria-label="' + esc(BIG + ' final: actual ' + D.actual[1].toFixed(4) +
           ', predicted ' + D.pred[1].toFixed(4)) + '"/>');
    if (key === 'wide') {
      var rows = [
        ['<circle cx="15" cy="0" r="6.5" fill="' + TEAL + '"/>', LADDER + ', final checkpoint'],
        ['<line x1="2" x2="28" y1="0" y2="0" stroke="' + FITC + '" stroke-width="2"/>', 'Ladder fit (L18–L42)'],
        ['<line x1="2" x2="28" y1="0" y2="0" stroke="' + FITC + '" stroke-width="2" stroke-dasharray="6 5"/>', 'Extrapolation'],
        ['<polygon fill="' + FITC + '" points="' + star(15, 0, 9) + '"/>', 'Predicted final'],
        ['<circle cx="15" cy="0" r="7" fill="none" stroke="' + ORANGE + '" stroke-width="2.25"/>', BIG + ' actual final']
      ];
      var lx = L.pl + 16, rh = 31, bh = rows.length * rh + 18, by = L.pb - 16 - bh;
      s.push('<g class="lgin"><rect x="' + lx + '" y="' + by + '" width="500" height="' + bh + '" rx="4"/>');
      rows.forEach(function (r, i) {
        var y = by + 9 + rh * (i + 0.5);
        s.push('<g transform="translate(' + (lx + 14) + ',' + y.toFixed(1) + ')">' + r[0] +
               '<text class="lgt" x="44" y="5">' + esc(r[1]) + '</text></g>');
      });
      s.push('</g>');
    }
    s.push('</svg>');
    return { html:s.join(''), L:L, X:X, Y:Y };
  }

  var root = document.getElementById('enll');
  var views = { wide:build('wide'), narrow:build('narrow') };
  document.getElementById('enll-title').textContent = TITLE;
  document.getElementById('enll-wide').innerHTML = views.wide.html;
  document.getElementById('enll-narrow').innerHTML = views.narrow.html;

  // legend, in the source's order (ladder and run eval trajectories removed per Paul)
  var LEG = [
    { l:'dots', label:'Ladder runs', sw:'<circle cx="15" cy="7" r="5.5" fill="' + TEAL + '"/>' },
    { l:'fit',  label:'Ladder fit (L18–L42)', sw:'<line x1="1" x2="29" y1="7" y2="7" stroke="' + FITC + '" stroke-width="2"/>' },
    { l:'ext',  label:'Extrapolation', sw:'<line x1="1" x2="29" y1="7" y2="7" stroke="' + FITC + '" stroke-width="2" stroke-dasharray="5 4"/>' },
    { l:'pred', label:'Predicted final', sw:'<polygon fill="' + FITC + '" points="' + star(15, 7, 7) + '"/>' },
    { l:'act',  label:'Actual final', sw:'<circle cx="15" cy="7" r="5" fill="none" stroke="' + ORANGE + '" stroke-width="2"/>' }
  ];
  document.getElementById('enll-leg').innerHTML = LEG.map(function (e) {
    return '<li><svg viewBox="0 0 30 14" aria-hidden="true">' + e.sw + '</svg><span>' + esc(e.label) + '</span></li>';
  }).join('');

  var gap = (D.actual[1] / D.pred[1] - 1) * 100;
  document.getElementById('enll-sr').innerHTML =
    '<p>Log-log plot of weighted eval NLL against training compute. Lower is better. A power law is fitted to the final ' +
    'checkpoints of five ladder runs: ' + D.rungs.map(function (r) { return r[0] + ' ' + r[2].toFixed(4); }).join(', ') +
    '. Extrapolated to the large run’s final compute, the fit predicts ' + D.pred[1].toFixed(4) + '. ' + BIG +
    ' finished at ' + D.actual[1].toFixed(4) + ', ' + (gap >= 0 ? '+' : '') + gap.toFixed(1) + '% from the prediction.</p>';

  // ---- point readout -------------------------------------------------------
  function show(key, id) {
    var v = views[key], L = v.L, svg = root.querySelector('#enll-' + key + ' svg');
    var x, y, rows;
    if (id === 'final') {
      x = v.X(D.actual[0]); y = v.Y(D.actual[1]);
      rows = [BIG + ' final', 'Actual', D.actual[1].toFixed(4), 'Predicted', D.pred[1].toFixed(4) +
              ' (' + (gap >= 0 ? '+' : '') + gap.toFixed(1) + '%)'];
    } else {
      var r = D.rungs[+id.slice(1)];
      x = v.X(r[1]); y = v.Y(r[2]);
      rows = [r[0] + ' final checkpoint', 'Eval NLL', r[2].toFixed(4), 'Compute', null, r[1]];
    }
    var ring = svg.querySelector('.ring');
    ring.setAttribute('cx', x); ring.setAttribute('cy', y); ring.classList.add('on');
    var tip = svg.querySelector('.tip'), pad = L.tipPad, lh = L.tipLh;
    var tx = x + 16 + L.tipW > L.pr ? x - 16 - L.tipW : x + 16;
    var ty = y - L.tipH - 14 < L.pt ? y + 16 : y - L.tipH - 14;
    tx = Math.max(L.pl + 4, Math.min(tx, L.pr - L.tipW));
    tip.setAttribute('transform', 'translate(' + tx.toFixed(1) + ',' + ty.toFixed(1) + ')');
    function set(sel, html, xx, yy) { var t = tip.querySelector(sel); t.innerHTML = html; t.setAttribute('x', xx); t.setAttribute('y', yy); }
    set('.r0', esc(rows[0]), pad, pad + 12);
    set('.r1', esc(rows[1]), pad, pad + 12 + lh); set('.v1', esc(rows[2]), L.tipW - pad, pad + 12 + lh);
    set('.r2', esc(rows[3]), pad, pad + 12 + lh * 2);
    set('.v2', rows[4] !== null ? esc(rows[4]) : flopsSvg(rows[5], key === 'wide' ? 10 : 8.5, key === 'wide' ? -6 : -5),
        L.tipW - pad, pad + 12 + lh * 2);
    tip.classList.add('on');
  }
  function hide(key) {
    var svg = root.querySelector('#enll-' + key + ' svg');
    svg.querySelector('.ring').classList.remove('on');
    svg.querySelector('.tip').classList.remove('on');
  }
  ['wide', 'narrow'].forEach(function (key) {
    var pinned = null, hits = root.querySelectorAll('#enll-' + key + ' .hit');
    for (var h = 0; h < hits.length; h++) (function (el) {
      var id = el.getAttribute('data-p');
      el.addEventListener('pointerenter', function (e) { if (e.pointerType === 'mouse' && pinned === null) show(key, id); });
      el.addEventListener('pointerleave', function (e) { if (e.pointerType === 'mouse' && pinned === null) hide(key); });
      el.addEventListener('focus', function () { if (pinned === null) show(key, id); });
      el.addEventListener('blur', function () { if (pinned === null) hide(key); });
      el.addEventListener('click', function () {
        if (pinned === id) { pinned = null; hide(key); } else { pinned = id; show(key, id); }
      });
      el.addEventListener('keydown', function (ev) {
        if (ev.key === 'Enter' || ev.key === ' ' || ev.key === 'Spacebar') { ev.preventDefault(); el.dispatchEvent(new MouseEvent('click', { bubbles:true })); }
      });
    })(hits[h]);
    document.addEventListener('pointerdown', function (e) {
      if (pinned !== null && !e.target.closest('#enll-' + key + ' .hit')) { pinned = null; hide(key); }
    });
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { hide('wide'); hide('narrow'); }
  });

  // ---- entrance: everything draws left to right; marks land as the edge passes
  function finish() {
    ['wide', 'narrow'].forEach(function (key) {
      var L = views[key].L;
      root.querySelector('#enll-' + key + ' .reveal').setAttribute('width', L.pr - L.pl + 10);
    });
    var ps = root.querySelectorAll('.pop');
    for (var i = 0; i < ps.length; i++) ps[i].classList.add('on');
  }
  function play() {
    var t0 = null, DUR = 2000;
    function frame(ts) {
      if (t0 === null) t0 = ts;
      var k = Math.min(1, (ts - t0) / DUR), e = 1 - Math.pow(1 - k, 3);
      ['wide', 'narrow'].forEach(function (key) {
        var L = views[key].L, w = (L.pr - L.pl + 10) * e, edge = L.pl + w;
        root.querySelector('#enll-' + key + ' .reveal').setAttribute('width', w.toFixed(1));
        var ps = root.querySelectorAll('#enll-' + key + ' .pop');
        for (var i = 0; i < ps.length; i++) if (+ps[i].getAttribute('data-x') <= edge) ps[i].classList.add('on');
      });
      if (k < 1) requestAnimationFrame(frame); else finish();
    }
    requestAnimationFrame(frame);
  }
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce || !('IntersectionObserver' in window) || !window.requestAnimationFrame) {
    finish();
  } else {
    root.classList.add('anim');
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) { if (en.isIntersecting) { io.disconnect(); play(); } });
    }, { threshold:0.2 });
    io.observe(root);
  }
})();
</script>

})();
